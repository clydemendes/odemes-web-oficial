<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,viewport-fit=cover" />
<title>Odemes — Personal Finance</title>
<meta name="description" content="Log income and expenses in seconds. Odemes scores your month from A to F so you always know where you stand." />
<link rel="icon" href="favicon.ico" sizes="any" />
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png" />
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png" />

<!-- PWA / installable web app -->
<link rel="manifest" href="manifest.webmanifest" />
<meta name="application-name" content="Odemes" />
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />

<!-- iOS standalone web app -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Odemes" />
<meta name="format-detection" content="telephone=no" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Newsreader:opsz,wght@6..72,300..600&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<style>
  /* ==========================================================
     Tokens
     Black, white and neutral greys. One accent: the Odemes green.
     Money in is green, money out is plain ink, red is for warnings.
     The landing page (.lp) is always light, whatever the app theme.
     ========================================================== */
  :root, .lp {
    color-scheme: light;
    --bg: #ffffff;
    --bg-warm: #f5f5f5;        /* quiet surface */
    --bg-warm-2: #ebebeb;      /* pressed / stronger surface */
    --bg-chrome: #e5e5e5;
    --text: #000000;
    --text-2: #525252;
    --text-3: #737373;
    --border: rgba(0,0,0,0.12);
    --border-soft: rgba(0,0,0,0.07);
    --hover: rgba(0,0,0,0.05);
    --ink: #000000;            /* primary buttons */
    --ink-fg: #ffffff;
    --ink-hover: #2b2b2b;
    --seg-active: #ffffff;
    --income: #0f8528;         /* green as text: deep enough to read on white */
    --income-tint: color-mix(in srgb, #1aae39 11%, transparent);
    --expense: var(--text);
    --expense-tint: var(--bg-warm);
    --danger: #d92d20;
    --danger-tint: rgba(217,45,32,0.08);
    --warn: var(--text);
    --warn-tint: var(--bg-warm);
    --teal: var(--income);
    --accent-text: color-mix(in srgb, var(--accent) 72%, #000);
    --shadow-card: 0 1px 2px rgba(0,0,0,0.04), 0 8px 24px -12px rgba(0,0,0,0.12);
    --shadow-deep: 0 2px 6px rgba(0,0,0,0.04), 0 24px 64px -16px rgba(0,0,0,0.22);
  }
  :root {
    --green: #1aae39;          /* the brand green, independent of the accent setting */
    --accent: #1aae39;
    --accent-deep: color-mix(in srgb, var(--accent) 84%, #000);
    --accent-tint: color-mix(in srgb, var(--accent) 12%, transparent);
    --font: 'Geist', -apple-system, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif;
    --font-display: 'Newsreader', 'Iowan Old Style', Georgia, serif;
    --mono: var(--font);       /* amounts: same family, tabular figures */
  }
  .lp { --accent: #1aae39; }
  [data-theme="dark"] {
    color-scheme: dark;
    --bg: #000000;
    --bg-warm: #161616;
    --bg-warm-2: #222222;
    --bg-chrome: #000000;
    --text: #ffffff;
    --text-2: #a8a8a8;
    --text-3: #808080;
    --border: rgba(255,255,255,0.16);
    --border-soft: rgba(255,255,255,0.09);
    --hover: rgba(255,255,255,0.08);
    --ink: #ffffff;
    --ink-fg: #000000;
    --ink-hover: #dedede;
    --seg-active: #2e2e2e;
    --income: #2bbd4a;
    --income-tint: color-mix(in srgb, #1aae39 18%, transparent);
    --danger: #ff5c4d;
    --danger-tint: rgba(255,92,77,0.14);
    --accent-text: color-mix(in srgb, var(--accent) 78%, #fff);
    --shadow-card: 0 0 0 1px rgba(255,255,255,0.08);
    --shadow-deep: 0 0 0 1px rgba(255,255,255,0.1), 0 24px 64px rgba(0,0,0,0.7);
  }
  [data-theme="dark"] .lp { color-scheme: light; }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  html {
    -webkit-text-size-adjust: 100%;   /* don't let iOS resize text in landscape */
    text-size-adjust: 100%;
  }
  body {
    font-family: var(--font);
    font-weight: 400;
    color: var(--text);
    background: var(--bg);
    font-size: 15px;
    line-height: 1.5;
    letter-spacing: -0.006em;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    font-feature-settings: 'lnum' 1;
    overflow-x: hidden;
    /* Native-app touch behaviour */
    -webkit-tap-highlight-color: transparent;   /* no grey flash on tap */
    overscroll-behavior-y: none;                /* kill pull-to-refresh / rubber-band */
    touch-action: manipulation;                 /* remove 300ms double-tap zoom delay */
  }
  /* Buttons & nav shouldn't show the text-selection caret/flicker on tap. */
  button, .side-item, .mobile-tab-bar-item, .seg button, .pill, .icon-btn, .btn {
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }
  a { color: inherit; text-decoration: none; }
  h1, h2, h3, .page-title {
    font-family: var(--font-display);
    font-weight: 400;
    letter-spacing: -0.02em;
  }
  button { font-family: inherit; letter-spacing: inherit; cursor: pointer; border: 0; background: transparent; color: inherit; }
  button:disabled { cursor: not-allowed; }
  input, select, textarea { font-family: inherit; letter-spacing: inherit; color: inherit; }
  ::selection { background: color-mix(in srgb, var(--accent) 26%, transparent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  b, strong { font-weight: 600; }
  .insight-txt b { font-weight: 500; }
  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; font-feature-settings: 'tnum' 1, 'lnum' 1; }

  /* ========== Stage ========== */
  .stage { min-height: 100vh; min-height: 100dvh; background: var(--bg); }
  .browser { width: 100%; background: var(--bg); min-height: 100vh; min-height: 100dvh; }
  .boot {
    min-height: 100vh; min-height: 100dvh;
    display: grid; place-items: center;
  }
  .boot-mark {
    width: 18px; height: 18px; border-radius: 99px;
    border: 2px solid var(--border); border-top-color: var(--text);
    animation: spin 700ms linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ========== App shell ========== */
  .app {
    display: grid;
    grid-template-columns: 240px 1fr;
    min-height: 100vh;
    background: var(--bg);
    transition: grid-template-columns 220ms ease;
  }
  .app[data-collapsed="1"] { grid-template-columns: 68px 1fr; }
  .side {
    background: var(--bg);
    border-right: 1px solid var(--border-soft);
    padding: 20px 14px 16px;
    display: flex; flex-direction: column;
    gap: 2px;
    position: sticky; top: 0;
    height: 100vh;
    overflow: hidden;
  }
  .side-brand {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 2px 4px 22px;
  }
  .side-brand-logo { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; }
  .side-brand img { height: 24px; flex-shrink: 0; }
  .side-collapse-btn {
    width: 28px; height: 28px; border-radius: 8px;
    display: grid; place-items: center;
    color: var(--text-3);
    transition: background 120ms ease, color 120ms ease;
    flex-shrink: 0;
  }
  .side-collapse-btn:hover { background: var(--hover); color: var(--text); }

  /* Collapsed state */
  .app[data-collapsed="1"] .side { padding: 20px 10px 16px; }
  .app[data-collapsed="1"] .side-brand-logo img { display: none; }
  .app[data-collapsed="1"] .side-brand {
    flex-direction: column; gap: 6px; padding: 2px 0 22px; align-items: center;
  }
  .app[data-collapsed="1"] .side-section { opacity: 0; height: 8px; padding: 6px 0; overflow: hidden; }
  .app[data-collapsed="1"] .side-item { justify-content: center; padding: 9px 0; }
  .app[data-collapsed="1"] .side-item span { display: none; }
  .app[data-collapsed="1"] .side-item .pill { display: none; }
  .app[data-collapsed="1"] .side-user-wrap { padding-top: 6px; }
  .app[data-collapsed="1"] .side-user {
    flex-direction: column; gap: 6px; padding: 8px 0; text-align: center;
  }
  .app[data-collapsed="1"] .side-user .nm,
  .app[data-collapsed="1"] .side-user .em { display: none; }

  .side-section {
    font-size: 12.5px; font-weight: 500;
    color: var(--text-3);
    padding: 10px 10px 8px;
  }
  .side-item {
    display: flex; align-items: center; gap: 11px;
    padding: 8px 10px; border-radius: 9px;
    font-size: 14.5px; font-weight: 450; color: var(--text-2);
    cursor: pointer;
    transition: background 120ms ease, color 120ms ease;
    text-align: left; width: 100%;
  }
  .side-item:hover { background: var(--hover); color: var(--text); }
  .side-item.active { background: var(--bg-warm); color: var(--text); font-weight: 500; }
  .side-item.active:hover { background: var(--bg-warm); }
  .side-item .ico { width: 17px; height: 17px; flex-shrink: 0; color: var(--text-3); transition: color 120ms ease; }
  .side-item:hover .ico { color: var(--text-2); }
  .side-item.active .ico { color: var(--accent); }
  .side-item .pill {
    margin-left: auto;
    padding: 1px 7px; border-radius: 9999px;
    background: var(--accent-tint); color: var(--accent-text);
    font-size: 10px; font-weight: 600;
  }
  .side-spacer { flex: 1 1 auto; min-height: 8px; }
  .side-legal {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    padding: 10px 8px 0;
    font-size: 12px; color: var(--text-3);
  }
  .side-legal a { color: var(--text-3); text-decoration: none; transition: color 120ms; }
  .side-legal a:hover { color: var(--text); }
  .app[data-collapsed="1"] .side-legal { display: none; }
  .side-user {
    display: flex; align-items: center; gap: 10px;
    padding: 8px;
    border: none;
    width: 100%; text-align: left;
    background: none;
    cursor: pointer; color: var(--text);
    border-radius: 10px;
    transition: background 120ms;
  }
  .side-user-wrap { border-top: 1px solid var(--border-soft); padding-top: 10px; }
  .side-user:hover { background: var(--hover); }
  .side-user.active { background: var(--bg-warm); }
  .side-user .av,
  .mobile-header-avatar,
  .avatar-lg {
    background: var(--ink); color: var(--ink-fg);
    font-weight: 600; letter-spacing: 0;
    display: grid; place-items: center;
  }
  .side-user .av { width: 30px; height: 30px; border-radius: 99px; font-size: 11.5px; flex-shrink: 0; }
  .avatar-lg { width: 56px; height: 56px; border-radius: 99px; font-size: 18px; flex-shrink: 0; }
  .side-user .nm { font-size: 13.5px; font-weight: 500; }
  .side-user .em { font-size: 12px; color: var(--text-3); }

  /* ========== Top bar ========== */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 28px;
    border-bottom: 1px solid var(--border-soft);
  }
  .topbar h1 { margin: 0; font-size: 22px; }
  .topbar .sub { font-size: 13px; color: var(--text-2); margin-top: 2px; }
  .topbar-right { display: flex; gap: 8px; align-items: center; }
  .icon-btn {
    width: 32px; height: 32px; border-radius: 9px;
    background: transparent;
    display: grid; place-items: center;
    color: var(--text-3);
    transition: background 120ms ease, color 120ms ease;
  }
  .icon-btn:hover { background: var(--hover); color: var(--text); }

  /* ========== Buttons ========== */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 9px 15px; border-radius: 10px;
    font-size: 14px; font-weight: 500;
    transition: transform 80ms ease, background 120ms ease, color 120ms ease, opacity 120ms ease;
    white-space: nowrap;
  }
  .btn:active:not(:disabled) { transform: scale(0.98); }
  .btn:disabled { opacity: 0.38; }
  .btn-primary { background: var(--ink); color: var(--ink-fg); }
  .btn-primary:hover:not(:disabled) { background: var(--ink-hover); }
  .btn-secondary { background: var(--bg-warm); color: var(--text); }
  .btn-secondary:hover:not(:disabled) { background: var(--bg-warm-2); }
  .btn-ghost { background: transparent; color: var(--text); padding: 8px 10px; }
  .btn-ghost:hover:not(:disabled) { background: var(--hover); }
  .btn-danger { background: var(--danger-tint); color: var(--danger); }
  .btn-danger:hover:not(:disabled) { background: color-mix(in srgb, var(--danger) 16%, transparent); }
  .btn-lg { padding: 12px 18px; font-size: 15px; }

  .page {
    padding: 40px 40px 56px;
    max-width: 1240px;
    margin: 0 auto;
    background: var(--bg);
  }
  .page-grid { display: grid; gap: 20px; }
  .page-title { margin: 0; font-size: 34px; line-height: 1.1; letter-spacing: -0.025em; }
  .page-sub { font-size: 15px; color: var(--text-2); margin-top: 6px; }

  /* ========== Cards ========== */
  .card {
    background: var(--bg);
    border: 1px solid var(--border-soft);
    border-radius: 16px;
    padding: 22px;
  }
  .card-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 16px; }
  .card-title { font-size: 15px; font-weight: 500; letter-spacing: -0.01em; }
  .card-sub { font-size: 13px; color: var(--text-3); }
  .stat-label { font-size: 13px; color: var(--text-3); }

  /* The entry form's amount field */
  .amount-field {
    display: flex; align-items: baseline; gap: 6px;
    padding: 18px 20px;
    border-radius: 14px;
    background: var(--bg-warm);
    transition: box-shadow 140ms ease, background 140ms ease;
  }
  .amount-field:focus-within { background: var(--bg); box-shadow: inset 0 0 0 1.5px var(--text); }
  .amount-field input:focus-visible { outline: none; }

  /* Rank chip: "1", "2", "3" next to the biggest spends */
  .rank {
    width: 24px; height: 24px; border-radius: 99px; flex-shrink: 0;
    display: grid; place-items: center;
    background: var(--bg-warm); color: var(--text-2);
    font-size: 11.5px; font-weight: 500;
    font-variant-numeric: tabular-nums;
  }
  .meter { height: 3px; border-radius: 99px; background: var(--border-soft); overflow: hidden; }
  .meter > i { display: block; height: 100%; border-radius: 99px; background: var(--text); }

  /* ========== Segmented controls ========== */
  .seg {
    display: inline-flex; padding: 3px; gap: 2px;
    background: var(--bg-warm);
    border-radius: 11px;
  }
  .seg button {
    padding: 6px 14px; border-radius: 8px;
    font-size: 13.5px; font-weight: 500; color: var(--text-3);
    transition: background 120ms ease, color 120ms ease;
  }
  .seg button:hover { color: var(--text); }
  .seg button.active {
    background: var(--seg-active); color: var(--text);
    box-shadow: 0 1px 2px rgba(0,0,0,0.08), 0 0 0 0.5px rgba(0,0,0,0.05);
  }
  .seg-sm button { padding: 4px 10px; font-size: 12.5px; border-radius: 7px; }

  /* ========== Pills / badges ========== */
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 10px; border-radius: 9999px;
    font-size: 12px; font-weight: 500;
    background: var(--accent-tint); color: var(--accent-text);
    width: fit-content;
  }
  .pill.income { background: var(--income-tint); color: var(--income); }
  .pill.expense { background: var(--text); color: var(--bg); }   /* due today */
  .pill.warn { background: var(--bg-warm-2); color: var(--text); }
  .pill.neutral { background: var(--bg-warm); color: var(--text-2); }
  .pill .dot { width: 6px; height: 6px; border-radius: 99px; background: currentColor; }

  /* ========== Inputs ========== */
  .input {
    width: 100%;
    padding: 10px 12px; border-radius: 10px;
    background: var(--bg);
    border: 1px solid var(--border);
    font-size: 15px; color: var(--text);
    transition: border-color 120ms ease, box-shadow 120ms ease;
  }
  .input:hover { border-color: color-mix(in srgb, var(--text) 30%, transparent); }
  .input:focus { outline: none; border-color: var(--text); box-shadow: 0 0 0 3px color-mix(in srgb, var(--text) 9%, transparent); }
  .input::placeholder { color: var(--text-3); }
  .label { font-size: 13px; font-weight: 500; color: var(--text-2); margin-bottom: 7px; display: block; }

  /* Toggle */
  .toggle {
    position: relative; width: 36px; height: 20px;
    background: var(--bg-warm-2); border-radius: 99px;
    cursor: pointer; transition: background 120ms ease;
    flex-shrink: 0;
  }
  .toggle::after {
    content: ""; position: absolute;
    top: 2px; left: 2px;
    width: 16px; height: 16px; border-radius: 99px;
    background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,0.2);
    transition: left 160ms ease;
  }
  .toggle.on { background: var(--accent); }
  .toggle.on::after { left: 18px; }

  /* ========== Quick-add bottom sheet ========== */
  .quick-add-scrim {
    position: fixed; inset: 0; z-index: 150;
    background: rgba(0,0,0,0.48);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    animation: qa-fade-in 180ms ease;
  }
  .quick-add-sheet {
    position: fixed; left: 0; right: 0; bottom: 0;
    z-index: 200;
    background: var(--bg);
    border-radius: 22px 22px 0 0;
    padding: 0 16px calc(20px + env(safe-area-inset-bottom, 0px));
    max-height: 85dvh; overflow-y: auto;
    display: flex; flex-direction: column; gap: 12px;
    box-shadow: 0 -8px 48px rgba(0,0,0,0.28);
    animation: qa-slide-up 260ms cubic-bezier(0.32, 0.72, 0, 1);
  }
  [data-theme="dark"] .quick-add-sheet {
    box-shadow: 0 -1px 0 rgba(255,255,255,0.12), 0 -8px 48px rgba(0,0,0,0.6);
  }
  @keyframes qa-fade-in { from { opacity: 0 } to { opacity: 1 } }
  @keyframes qa-slide-up { from { transform: translateY(100%) } to { transform: translateY(0) } }
  .quick-add-handle-row {
    display: flex; align-items: center; justify-content: flex-end;
    padding: 10px 0 2px;
    position: relative;
  }
  .quick-add-drag-handle {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: 36px; height: 4px; border-radius: 99px;
    background: var(--border);
  }
  .quick-add-close {
    width: 30px; height: 30px; border-radius: 99px;
    background: var(--bg-warm);
    display: grid; place-items: center;
    color: var(--text-2); cursor: pointer;
    transition: background 120ms, color 120ms;
  }
  .quick-add-close:hover { background: var(--bg-warm-2); color: var(--text); }
  .quick-add-amount-row { display: flex; align-items: baseline; gap: 6px; padding: 4px 0; }
  .quick-add-symbol { font-size: 24px; color: var(--text-3); font-weight: 400; }
  .quick-add-amount-input {
    flex: 1; width: 100%; border: 0; outline: none; background: transparent;
    font-size: 52px; font-weight: 500; letter-spacing: -0.035em;
    color: var(--text); padding: 0; line-height: 1;
    min-width: 0;
  }
  .quick-add-amount-input::placeholder { color: var(--border); }
  .quick-add-more-toggle {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 13px; font-weight: 500; color: var(--text-3);
    background: none; border: none; cursor: pointer; padding: 2px 0;
    -webkit-tap-highlight-color: transparent;
    transition: color 120ms;
  }
  .quick-add-more-toggle:hover { color: var(--text-2); }

  /* dark logo swap */
  .logo-light { display: block; }
  .logo-dark  { display: none; }
  [data-theme="dark"] .logo-light { display: none; }
  [data-theme="dark"] .logo-dark  { display: block; }

  /* ==========================================================
     Landing page  (.lp)  — signed-out visitors
     ========================================================== */
  .lp {
    position: relative;
    min-height: 100vh; min-height: 100dvh;
    background: #fff; color: #000;
    font-size: 16px;
  }
  .lp-wrap { width: min(100% - 48px, 1120px); margin-inline: auto; }
  .dot-field-container { position: relative; width: 100%; height: 100%; }

  /* ── Nav ── */
  .lp-nav {
    position: sticky; top: 0; z-index: 40;
    background: rgba(255,255,255,0.82);
    backdrop-filter: saturate(180%) blur(14px);
    -webkit-backdrop-filter: saturate(180%) blur(14px);
    border-bottom: 1px solid transparent;
    transition: border-color 200ms ease;
  }
  .lp-nav.is-stuck { border-bottom-color: var(--border-soft); }
  .lp-nav-inner {
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    height: 68px;
  }
  .lp-logo { display: inline-flex; justify-self: start; border-radius: 8px; }
  .lp-logo img { height: 28px; width: auto; display: block; }
  .lp-nav-links { display: flex; gap: 34px; font-size: 14.5px; color: var(--text-2); }

  }

  /* One entrance, on load. Nothing else on the page animates by itself. */
  @media (prefers-reduced-motion: no-preference) {
    .lp-hero .lp-rise { animation: lp-rise 800ms cubic-bezier(0.2, 0.7, 0.2, 1) both; }
    .lp-hero .lp-rise:nth-child(2) { animation-delay: 70ms; }

  }

  /* ── Live demo: a working slice of the app ── */

    display: grid; grid-template-columns: 204px minmax(0, 1fr);

    background: #fff;

  .lp-demo-nav {
    display: flex; align-items: center; gap: 11px;

  }

  }
  .lp-demo-badge i { width: 6px; height: 6px; border-radius: 99px; background: var(--accent); }
  .lp-demo-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; align-items: stretch; }
  .lp-entry { display: flex; flex-direction: column; }

  .lp-amount span { font-size: 22px; color: var(--text-3); }
  .lp-amount input {
    flex: 1; min-width: 0; width: 100%; padding: 0;

  }

  }
  .lp-chip:hover { background: var(--bg-warm-2); color: #000; }

  .lp-save { width: 100%; margin-top: 18px; padding: 12px 16px; font-size: 15px; }

  .lp-grade { display: flex; align-items: center; gap: 18px; }

  .lp-flow { margin-top: 20px; display: grid; gap: 10px; }
  .lp-flow-row { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: 13.5px; color: var(--text-2); }
  .lp-flow-row b { font-weight: 500; color: #000; font-variant-numeric: tabular-nums; }
  .lp-flow-bar { grid-column: 1 / -1; height: 5px; border-radius: 99px; background: var(--bg-warm); overflow: hidden; }
  .lp-flow-bar i { display: block; height: 100%; border-radius: 99px; transition: width 800ms cubic-bezier(0.2, 0.8, 0.2, 1); }
  .lp-kept { margin-top: 14px; font-size: 13.5px; color: var(--text-3); }

  .lp-row {

  /* ── Sections ── */
  .lp-section { padding: 148px 0 0; }
  .lp-anchor { scroll-margin-top: 112px; }
  .lp-h2 {
    margin: 0;
    font-size: clamp(36px, 4.6vw, 58px);
    line-height: 1.04; letter-spacing: -0.035em;
    text-wrap: balance;
  }
  .lp-sub {
    margin: 22px 0 0; max-width: 560px;
    font-size: clamp(16.5px, 1.4vw, 18.5px); line-height: 1.55;
    color: var(--text-2);
    text-wrap: pretty;
  }
  .lp-center { text-align: center; }
  .lp-center .lp-sub { margin-inline: auto; }

  /* The grade scale */
  .lp-scale {
    display: grid; grid-template-columns: repeat(5, 1fr);

  .lp-scale-range { margin-top: 28px; font-size: 16px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .lp-scale-word { margin-top: 3px; font-size: 14.5px; color: var(--text-3); }

  /* Feature rows */
  .lp-features { display: grid; gap: 132px; }
  .lp-feature { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 72px; align-items: center; }
  .lp-feature:nth-child(even) .lp-feature-media { order: -1; }
  .lp-feature-copy { max-width: 430px; }
  .lp-feature:nth-child(even) .lp-feature-copy { justify-self: end; }
  .lp-h3 { margin: 0; font-size: clamp(30px, 3.3vw, 42px); line-height: 1.06; letter-spacing: -0.03em; text-wrap: balance; }
  .lp-feature-copy p { margin: 18px 0 0; font-size: 17.5px; line-height: 1.55; color: var(--text-2); text-wrap: pretty; }

  }
  .lp-mock {

    border-radius: 18px;

    text-align: left;
  }
  .lp-mock-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 14px; }

  .lp-phone {
    width: 284px; padding: 10px;
    border-radius: 44px;
    background: #000;
    box-shadow: 0 30px 60px -28px rgba(0,0,0,0.45);
  }
  .lp-phone-screen {
    display: flex; flex-direction: column; gap: 14px;
    min-height: 430px; padding: 16px 16px 18px;
    border-radius: 35px; background: #fff;
    text-align: left;
  }

  .lp-phone-amount { display: flex; align-items: baseline; gap: 5px; padding: 6px 0 0; font-size: 50px; font-weight: 500; letter-spacing: -0.04em; line-height: 1; font-variant-numeric: tabular-nums; }
  .lp-phone-amount span { font-size: 22px; font-weight: 400; color: var(--text-3); letter-spacing: 0; }
  .lp-phone-input { padding: 11px 13px; border-radius: 11px; border: 1px solid var(--border); font-size: 15px; }
  .lp-phone-save { margin-top: auto; padding: 14px; border-radius: 12px; background: #000; color: #fff; text-align: center; font-size: 15px; font-weight: 500; }
  .lp-bill { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--border-soft); }
  .lp-bill-ico { width: 34px; height: 34px; border-radius: 99px; display: grid; place-items: center; background: var(--bg-warm); color: var(--text-2); font-size: 13.5px; font-weight: 500; }
  .lp-bill-ico.in { background: var(--income-tint); color: var(--income); }
  .lp-bill-name { font-size: 14.5px; font-weight: 500; }
  .lp-bill-meta { display: flex; align-items: center; gap: 8px; margin-top: 3px; }
  .lp-bill-amt { font-size: 14.5px; font-weight: 500; font-variant-numeric: tabular-nums; text-align: right; }
  .lp-bill-amt.in { color: var(--income); }
  .lp-bill-confirm { display: inline-flex; align-items: center; gap: 5px; margin-top: 5px; padding: 4px 10px; border-radius: 8px; background: #000; color: #fff; font-size: 12px; font-weight: 500; }

  .lp-legend span { display: inline-flex; align-items: center; gap: 6px; }
  .lp-legend i { width: 14px; height: 2px; border-radius: 99px; }
  .lp-cat { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; padding: 10px 0 0; font-size: 14px; }

  .lp-cat span { color: var(--text-2); font-variant-numeric: tabular-nums; }

  /* Facts, set as a sentence rather than a row of stat tiles */
  .lp-facts {
    margin: 0 auto; max-width: 900px;
    font-family: var(--font-display);
    font-size: clamp(26px, 3.1vw, 38px); line-height: 1.24; letter-spacing: -0.025em;
    text-align: center; text-wrap: balance;
  }

  /* FAQ */
  .lp-faq { display: grid; grid-template-columns: minmax(0, 4fr) minmax(0, 7fr); gap: 72px; align-items: start; }
  .lp-faq-list { border-top: 1px solid var(--border); }

  .lp-faq-item summary {
    display: flex; align-items: center; justify-content: space-between; gap: 20px;
    padding: 22px 0;
    font-size: 18px; font-weight: 500; letter-spacing: -0.012em;
    cursor: pointer; list-style: none;
    border-radius: 6px;

  .lp-faq-item summary::-webkit-details-marker { display: none; }
  .lp-faq-item summary svg { flex-shrink: 0; color: var(--text-3); transition: transform 220ms ease, color 140ms ease; }
  .lp-faq-item summary:hover svg { color: #000; }
  .lp-faq-item[open] summary svg { transform: rotate(45deg); }
  .lp-faq-item p { margin: 0; padding: 0 44px 24px 0; max-width: 620px; font-size: 16.5px; line-height: 1.6; color: var(--text-2); }
  .lp-faq-item p a { color: #000; text-decoration: underline; text-decoration-color: var(--border); text-underline-offset: 3px; }
  .lp-faq-item p a:hover { text-decoration-color: currentColor; }

  /* ── Closing band + footer: the page turns black ── */
  .lp-dark {
    position: relative; isolation: isolate; overflow: hidden;
    margin-top: 148px;
    background: #000; color: #fff;
  }
  .lp-dark-bg {
    position: absolute; inset: 0; z-index: -1;
    pointer-events: none;
    -webkit-mask-image: radial-gradient(75% 85% at 50% 35%, #000 0%, transparent 100%);
            mask-image: radial-gradient(75% 85% at 50% 35%, #000 0%, transparent 100%);
  }
  .lp-close { padding: 136px 0 128px; text-align: center; }
  .lp-close .lp-sub { color: rgba(255,255,255,0.62); margin-inline: auto; }
  .lp-dark .lp-btn-ink { background: #fff; color: #000; }
  .lp-dark .lp-btn-ink:hover:not(:disabled) { background: #dedede; }
  .lp-dark .lp-btn-line { background: transparent; color: #fff; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.3); }
  .lp-dark .lp-btn-line:hover:not(:disabled) { background: rgba(255,255,255,0.1); }
  .lp-dark :focus-visible { outline-color: #fff; }
  .lp-foot {
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 20px 32px;
    padding: 28px 0 calc(32px + env(safe-area-inset-bottom, 0px));

    font-size: 14px; color: rgba(255,255,255,0.6);
  }
  .lp-foot-brand { display: flex; align-items: center; gap: 18px; }
  .lp-foot-brand img { height: 24px; width: auto; display: block; }
  .lp-foot-links { display: flex; flex-wrap: wrap; gap: 8px 26px; }
  .lp-foot-links a, .lp-foot-links button { color: rgba(255,255,255,0.6); font-size: 14px; padding: 0; border-radius: 4px; transition: color 140ms ease; }
  .lp-foot-links a:hover, .lp-foot-links button:hover { color: #fff; }

  /* ── Dialogs (sign in, App Store QR) ── */
  .lp-overlay {
    position: fixed; inset: 0; z-index: 300;
    display: grid; place-items: center; padding: 20px;
    background: rgba(0,0,0,0.42);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    animation: qa-fade-in 160ms ease;
  }
  .lp-dialog {
    position: relative;
    width: 100%; max-width: 384px;
    padding: 36px 28px 24px;
    border-radius: 24px;
    background: #fff; color: #000;
    text-align: center;
    box-shadow: 0 32px 80px rgba(0,0,0,0.28);
    animation: lp-dialog-in 240ms cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  @keyframes lp-dialog-in { from { opacity: 0; transform: translateY(12px) scale(0.98); } to { opacity: 1; transform: none; } }
  .lp-dialog-close {
    position: absolute; top: 14px; right: 14px;
    width: 32px; height: 32px; border-radius: 99px;
    display: grid; place-items: center;
    color: var(--text-3);
    transition: background 120ms ease, color 120ms ease;
  }
  .lp-dialog-close:hover { background: var(--bg-warm); color: #000; }
  .lp-dialog-mark { width: 44px; height: 44px; border-radius: 12px; margin: 0 auto 20px; display: block; }
  .lp-dialog h2 { margin: 0; font-size: 30px; line-height: 1.1; letter-spacing: -0.03em; }
  .lp-dialog-sub { margin: 10px 0 26px; font-size: 15.5px; color: var(--text-2); }
  .lp-dialog .lp-btn + .lp-btn { margin-top: 10px; }
  .lp-dialog .lp-error { margin-top: 14px; text-align: left; }
  .lp-dialog-foot {
    display: flex; align-items: center; justify-content: center; gap: 7px;
    margin-top: 22px;
    font-size: 12.5px; color: var(--text-3);
  }
  .lp-qr { display: inline-block; padding: 14px; border-radius: 18px; background: #fff; box-shadow: inset 0 0 0 1px var(--border); margin-bottom: 22px; }
  .lp-qr img { display: block; width: 184px; height: 184px; }

  @media (prefers-reduced-motion: reduce) {
    .quick-add-sheet, .quick-add-scrim, .lp-overlay, .lp-dialog { animation: none; }
    .lp-ring .fill, .lp-flow-bar i { transition: none; }
  }

            if (sw.state === 'installed' && navigator.serviceWorker.controller) {
